<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dc143c" />
    <title>LinguaNotes — tus notas de idiomas, organizadas</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- PWA: permite instalar la app y que funcione sin internet -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <!-- App en JavaScript puro: NO necesita internet ni ningún CDN. Funciona siempre. -->
    <script type="module" src="./src/main.js"></script>
    <!-- Registrar el Service Worker para que la app funcione offline -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").catch(function (e) {
            console.warn("No se pudo registrar el service worker:", e);
          });
        });
      }
    </script>
  </body>
</html>
